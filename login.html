<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - SpendWise</title>
  <link rel="stylesheet" href="stylelogin.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <!-- Back to home link -->
    <a href="index.html" class="auth-back">&larr; Back to home</a>

    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="logo">Spend<span>Wise</span></a>
        <h2>Welcome back</h2>
        <p>Log in to access your financial dashboard.</p>
      </div>

      <!-- Social Login -->
      <button class="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.616z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958l3.007 2.332E5.036-2.127A5.407 5.407 0 0 1 9 3.58z"/>
        </svg>
        Log in with Google
      </button>

      <div class="auth-divider">
        <span>or log in with email</span>
      </div>

      <!-- Form -->
      <form class="auth-form" action="#" method="POST">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="alex@example.com" required>
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label for="password">Password</label>
            <a href="#" class="forgot-link">Forgot?</a>
          </div>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <div class="form-checkbox">
          <input type="checkbox" id="remember">
          <label for="remember">Remember me for 30 days</label>
        </div>

        <button type="submit" class="btn btn-pill-primary btn-full">Log In</button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="signup.html">Sign up</a></p>
      </div>
    </div>
  </div>

</body>
</html>
