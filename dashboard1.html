<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise - Dashboard</title>
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <div class="d-flex min-vh-100">
    <!-- Sidebar -->
    <aside class="bg-white border-end p-3" style="width: 260px;">
      <h4 class="text-primary fw-bold mb-4">SpendWise</h4>
      <ul class="nav flex-column sidebar-nav">
        <li class="nav-item mb-2">
          <a class="nav-link active rounded text-dark fw-semibold" href="#"><i class="bi bi-house me-2"></i> Dashboard</a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link rounded text-secondary" href="#"><i class="bi bi-wallet2 me-2"></i> Transactions</a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link rounded text-secondary" href="#"><i class="bi bi-pie-chart me-2"></i> Analytics</a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link rounded text-secondary" href="#"><i class="bi bi-gear me-2"></i> Settings</a>
        </li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow-1 p-4">
      <!-- Top Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold mb-1">Dashboard</h2>
          <p class="text-muted small mb-0">Welcome back! Here is your financial summary.</p>
        </div>
        <button id="openModalBtn" class="btn btn-primary px-3">
          <i class="bi bi-plus-lg me-1"></i> Add Transaction
        </button>
      </div>

      <!-- Metric Cards -->
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="card border-0 shadow-sm p-3">
            <span class="text-muted small">Total Balance</span>
            <h3 class="fw-bold mt-1 mb-0" id="totalBalance">$0.00</h3>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card border-0 shadow-sm p-3">
            <span class="text-muted small">Total Income</span>
            <h3 class="fw-bold text-success mt-1 mb-0" id="totalIncome">+$0.00</h3>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card border-0 shadow-sm p-3">
            <span class="text-muted small">Total Expenses</span>
            <h3 class="fw-bold text-danger mt-1 mb-0" id="totalExpenses">-$0.00</h3>
          </div>
        </div>
      </div>

      <!-- Recent Transactions Section -->
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3 border-bottom-0">
          <h5 class="card-title fw-bold mb-0">Recent Transactions</h5>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Description</th>
                <th>Category</th>
                <th>Date</th>
                <th>Amount</th>
                <th class="text-end">Action</th>
              </tr>
            </thead>
            <tbody id="transactionList">
              <!-- Dynamically populated via JavaScript -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Transaction Modal -->
  <div id="transactionModal" class="modal" tabindex="-1" style="background: rgba(0,0,0,0.5);">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Add New Transaction</h5>
          <button type="button" class="btn-close" id="closeModalBtn" aria-label="Close"></button>
        </div>
        <form id="transactionForm">
          <div class="modal-body">
            <div class="mb-3">
              <label for="txDescription" class="form-label">Description</label>
              <input type="text" id="txDescription" class="form-control" placeholder="e.g. Salary, Rent, Coffee" required>
            </div>
            <div class="mb-3">
              <label for="txAmount" class="form-label">Amount ($)</label>
              <input type="number" step="0.01" id="txAmount" class="form-control" placeholder="0.00" required>
            </div>
            <div class="mb-3">
              <label for="txType" class="form-label">Type</label>
              <select id="txType" class="form-select" required>
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="txCategory" class="form-label">Category</label>
              <select id="txCategory" class="form-select" required>
                <option value="Food & Dining">Food & Dining</option>
                <option value="Salary">Salary</option>
                <option value="Utilities">Utilities</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Shopping">Shopping</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="txDate" class="form-label">Date</label>
              <input type="date" id="txDate" class="form-control">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" id="cancelBtn">Cancel</button>
            <button type="submit" class="btn btn-primary">Add Transaction</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
